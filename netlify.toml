# Netlify build settings for the IHG frontend.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "22"
    # The backend address, built into the site at build time. Not a secret:
    # it ends up in the browser's JavaScript either way.
    VITE_API_URL = "https://ihg-management-platform.onrender.com/api/v1"

# The site is a single-page app: every address is handled by index.html.
# Without this, refreshing a page such as /hotels/... returns Netlify's 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200